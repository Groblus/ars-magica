name: Python

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install '.[test,mcp,publishing]'

      - name: Run tests
        run: ARS_MAGICA_DB_PATH="${RUNNER_TEMP}/ars-magica-corpus-build/skills/ars-magica-corpus-navigator/resources/ars_magica.sqlite" python -m pytest

      - name: Build and validate embedding-free corpus database
        shell: bash
        run: |
          set -euo pipefail
          build_root="${RUNNER_TEMP}/ars-magica-corpus-build"
          export ARS_MAGICA_DB_PATH="${build_root}/skills/ars-magica-corpus-navigator/resources/ars_magica.sqlite"
          GIT_LFS_SKIP_SMUDGE=1 git clone --no-local "${GITHUB_WORKSPACE}" "${build_root}"
          cd "${build_root}"
          rm -f skills/ars-magica-corpus-navigator/resources/ars_magica.sqlite
          python skills/ars-magica-corpus-navigator/scripts/build_index.py
          python skills/ars-magica-corpus-navigator/scripts/validate.py
          test -s "${ARS_MAGICA_DB_PATH}"
