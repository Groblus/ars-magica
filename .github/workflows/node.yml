name: JavaScript and TypeScript

on:
  pull_request:
    paths:
      - "experiments/wizard-study/web/**"
      - ".github/workflows/node.yml"
  push:
    paths:
      - "experiments/wizard-study/web/**"
      - ".github/workflows/node.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/wizard-study/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiments/wizard-study/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
